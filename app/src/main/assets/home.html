<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browdika</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f7f8fa;
            --card: #ffffff;
            --text: #14181f;
            --muted: #5f6b7a;
            --accent: #1565c0;
            --border: #e2e6ec;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1216;
                --card: #171b21;
                --text: #eef2f7;
                --muted: #9aa7b6;
                --accent: #6ea8fe;
                --border: #262c35;
            }
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f1216;
            --card: #171b21;
            --text: #eef2f7;
            --muted: #9aa7b6;
            --accent: #6ea8fe;
            --border: #262c35;
        }
        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f7f8fa;
            --card: #ffffff;
            --text: #14181f;
            --muted: #5f6b7a;
            --accent: #1565c0;
            --border: #e2e6ec;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .logo {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: var(--accent);
            display: grid;
            place-items: center;
            color: #fff;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.5px; }
        p.sub { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
        .marquee {
            width: 100%;
            max-width: 560px;
            margin: 0 0 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            line-height: 1.2;
            white-space: nowrap;
        }
        .marquee-track {
            display: inline-flex;
            padding: 10px 0;
            animation: marquee 18s linear infinite;
            will-change: transform;
        }
        .marquee-track span {
            flex: 0 0 auto;
            padding-right: 56px;
        }
        @keyframes marquee {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        @media (prefers-reduced-motion: reduce) {
            .marquee { white-space: normal; }
            .marquee-track {
                display: block;
                padding: 10px 14px;
                animation: none;
            }
            .marquee-track span {
                display: block;
                padding-right: 0;
            }
            .marquee-track span[aria-hidden="true"] { display: none; }
        }
        form {
            width: 100%;
            max-width: 560px;
            display: flex;
            gap: 8px;
        }
        input[type="text"] {
            flex: 1;
            height: 50px;
            padding: 0 18px;
            border-radius: 25px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        button {
            height: 50px;
            padding: 0 22px;
            border: 0;
            border-radius: 25px;
            background: var(--accent);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
        }
        .grid {
            width: 100%;
            max-width: 560px;
            margin-top: 32px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        a.tile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }
        a.tile span.badge {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: var(--bg);
            font-size: 16px;
        }
        footer { margin-top: 36px; color: var(--muted); font-size: 12px; }
    </style>
</head>
<body>
    <div class="logo">B</div>
    <h1>Browdika</h1>
    <p class="sub">Cari di Google atau buka situs favoritmu.</p>

    <div class="marquee" role="marquee" aria-label="Semoga senang Menggunakan Browser ini, Gunakan Dengan Bijak. Salam Dari @ndik@">
        <div class="marquee-track">
            <span>Semoga senang Menggunakan Browser ini, Gunakan Dengan Bijak. Salam Dari @ndik@</span>
            <span aria-hidden="true">Semoga senang Menggunakan Browser ini, Gunakan Dengan Bijak. Salam Dari @ndik@</span>
        </div>
    </div>

    <form action="https://www.google.com/search" method="get">
        <input type="text" name="q" placeholder="Cari di Google…" autocomplete="off" />
        <button type="submit">Cari</button>
    </form>

    <div class="grid">
        <a class="tile" href="https://www.google.com">
            <span class="badge">G</span> Google
        </a>
        <a class="tile" href="https://m.facebook.com">
            <span class="badge">f</span> Facebook
        </a>
        <a class="tile" href="https://www.facebook.com/messages">
            <span class="badge">✉</span> Pesan Facebook
        </a>
        <a class="tile" href="https://m.youtube.com">
            <span class="badge">▶</span> YouTube
        </a>
        <a class="tile" href="https://id.wikipedia.org">
            <span class="badge">W</span> Wikipedia
        </a>
    </div>

    <footer>Browdika • browser pribadi</footer>
</body>
</html>
