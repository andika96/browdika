name: Build Browdika APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          echo "Using: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BROWDIKA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/browdika.p12"
          test -s "$RUNNER_TEMP/browdika.p12"
          echo "keystore_bytes=$(wc -c < "$RUNNER_TEMP/browdika.p12")"

      - name: Build debug APK
        env:
          BROWDIKA_KEYSTORE_PATH: ${{ runner.temp }}/browdika.p12
          BROWDIKA_STORE_PASSWORD: ${{ secrets.BROWDIKA_STORE_PASSWORD }}
          BROWDIKA_KEY_ALIAS: ${{ secrets.BROWDIKA_KEY_ALIAS }}
          BROWDIKA_KEY_PASSWORD: ${{ secrets.BROWDIKA_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: browdika-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
